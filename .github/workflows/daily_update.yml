name: Daily Cardamom Data Update

on:
  schedule:
    # Run every day at 15:30 UTC (9:00 PM IST)
    - cron: '30 15 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scraper-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-scraper-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install scraper dependencies (not full requirements)
          pip install requests beautifulsoup4 html5lib pandas

      - name: Run daily update
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/cardamom_data.db
          git diff --cached --quiet || git commit -m "📊 Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Log completion
        run: |
          echo "✅ Daily cardamom data update completed"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
